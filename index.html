  const z = zoom * DPR; ctx.setTransform(z, 0, 0, z, 0, 0); drawBackground();
  ctx.setTransform(z, 0, 0, z, (viewW / 2 - 1200) * z, 0);
  camX = 1200 - viewW / 2; drawFloor();
  const demo = Object.assign(newPlayer(), { x: 1200 - 110, animT: uiT, facing: 1 });
  const k = (uiT % 2.4) / 0.3; if (k < 1) demo.sw = { t: k * 0.3, dur: 0.3, def: MOVES.mid[0], from: NEUT };
  const foe = Object.assign({}, TYPES.duelist, { type: 'duelist', x: 1200 + 110, y: GROUND, vx: 0, facing: -1, onGround: true, animT: uiT + 1, run: 0, trail: [], state: 'chase', blockT: k < 1 ? 1 : 0, hitFlash: 0 });
  drawFigure(demo); drawFigure(foe);
  ctx.setTransform(z, 0, 0, z, 0, 0);
  ctx.save(); ctx.shadowColor = turtleMode ? '#86d44e' : BLADES[bladeIdx]; ctx.shadowBlur = 30 * z; text('STICK SABERS', viewW / 2, 150, Math.min(92, viewW / 8)); ctx.restore();
  text('survive the waves. deflect the bolts. break the line.', viewW / 2, 186, 16, '#b8b4d8', 'center', 600);
  uiRects = [];
  { const w = 190, x = viewW / 2 - w / 2, y = 196, on = turtleMode;
    ctx.fillStyle = on ? 'rgba(90,150,50,0.45)' : 'rgba(40,34,80,0.6)'; ctx.fillRect(x, y, w, 24);
    ctx.strokeStyle = on ? '#86d44e' : 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, w, 24);
    text('T  ·  TURTLE: ' + TURTLES[turtleMode], viewW / 2, y + 16, 12, on ? '#c8f5a4' : '#aaa');
    uiRects.push({ x, y, w, h: 24, fn: toggleTurtle }); }
  text(turtleMode === 1 ? 'STEEL KATANA' : turtleMode === 2 ? 'OAK NUNCHAKU' : 'BLADE', viewW / 2, 236, 11, '#888');
  if (turtleMode === 2) { const cx = viewW / 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#c98d45'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(cx - 44, 262); ctx.lineTo(cx - 10, 256); ctx.moveTo(cx + 10, 256); ctx.lineTo(cx + 44, 262); ctx.stroke(); ctx.strokeStyle = '#b9c0c8'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(cx - 10, 256); ctx.quadraticCurveTo(cx, 264, cx + 10, 256); ctx.stroke(); }
  else if (turtleMode) { ctx.strokeStyle = STEEL; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(viewW / 2 - 40, 262); ctx.quadraticCurveTo(viewW / 2, 252, viewW / 2 + 44, 256); ctx.stroke(); ctx.strokeStyle = '#c9a23a'; ctx.beginPath(); ctx.moveTo(viewW / 2 - 40, 256); ctx.lineTo(viewW / 2 - 40, 268); ctx.stroke(); }
  else BLADES.forEach((c, i) => {
    const x = viewW / 2 + (i - (BLADES.length - 1) / 2) * 46, y = 258;
    ctx.save(); ctx.shadowColor = c; ctx.shadowBlur = (i === bladeIdx ? 18 : 4) * z; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, i === bladeIdx ? 12 : 8, 0, 6.2832); ctx.fill(); ctx.restore();
    if (i === bladeIdx) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 16, 0, 6.2832); ctx.stroke(); }
    uiRects.push({ x: x - 20, y: y - 20, w: 40, h: 40, fn: () => { bladeIdx = i; store.set('ss_blade', String(i)); sfx('ui'); } });
  });
  if (Math.floor(uiT * 2) % 2) text('PRESS ENTER OR CLICK TO START', viewW / 2, 318, 18, '#fff');
  { const w = 190, x = viewW / 2 - w / 2, y = 334;
    ctx.fillStyle = 'rgba(40,34,80,0.6)'; ctx.fillRect(x, y, w, 24); ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, w, 24);
    text('P  ·  PRACTICE MODE', viewW / 2, y + 16, 12, '#cfcfe6');
    uiRects.push({ x, y, w, h: 24, fn: () => { sfx('ui'); pressed.clear(); startPractice(); } }); }
  const c = '#cfcfe6';
  text('A / D  move      W / Space  jump (double)      R  high      F / Click  mid      C  low  — mix any 3 for a finisher; try them running and mid-air', viewW / 2, VIEW_H - 62, 13, c, 'center', 600);
  text('Q / Right-click  block — tap just before impact to PARRY, block bolts to send them back      back + attack up close: retreating strike', viewW / 2, VIEW_H - 42, 13, c, 'center', 600);
  text('Shift  dash through attacks      E  energy push      1–8  hold a stance (same key again: auto)      P  pause      M  mute', viewW / 2, VIEW_H - 22, 13, c, 'center', 600);
  if (best) text('BEST ' + best, viewW - 24, 36, 16, '#ffd23a', 'right');
}
function drawUpgrade() {
  overlay(0.72); uiRects = [];
  text('WAVE ' + wave + ' CLEARED', viewW / 2, 130, 44, '#ffd23a');
  text('choose an upgrade', viewW / 2, 160, 15, '#b8b4d8', 'center', 600);
  const cw = Math.min(220, (viewW - 100) / 3), gap = 24, total = cw * 3 + gap * 2;
  upgradeChoices.forEach((u, i) => {
    const x = viewW / 2 - total / 2 + i * (cw + gap), y = 200, h = 170;
    const hov = mouse.x > x && mouse.x < x + cw && mouse.y > y && mouse.y < y + h;
    ctx.fillStyle = hov ? 'rgba(90,80,170,0.55)' : 'rgba(40,34,80,0.7)'; ctx.fillRect(x, y, cw, h);
    ctx.strokeStyle = hov ? player.blade : 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; ctx.strokeRect(x, y, cw, h);
    text(String(i + 1), x + 14, y + 26, 16, player.blade, 'left');
    text(u.name, x + cw / 2, y + 66, 22);
    u.desc.split('\n').forEach((l, j) => text(l, x + cw / 2, y + 100 + j * 19, 14, '#cfcfe6', 'center', 500));
    uiRects.push({ x, y, w: cw, h, fn: () => pickUpgrade(i) });
  });
  text('press 1 · 2 · 3 or click', viewW / 2, 410, 13, '#888', 'center', 600);
}
function drawOver() {
  overlay(Math.min(0.75, uiT));
  text('CUT DOWN', viewW / 2, 210, 72, '#ff3b3b');
  text('reached wave ' + wave, viewW / 2, 258, 20, '#fff', 'center', 600);
  text('SCORE ' + score, viewW / 2, 300, 30, '#ffd23a');
  text(score >= best && score > 0 ? 'NEW BEST!' : 'BEST ' + best, viewW / 2, 328, 15, '#b8b4d8', 'center', 600);
  if (uiT > 0.6 && Math.floor(uiT * 2) % 2) text('PRESS ENTER OR CLICK TO FIGHT AGAIN', viewW / 2, 390, 18);
}
function render() {
  const z = zoom * DPR;
  if (state === 'title') return drawTitle();
  ctx.setTransform(z, 0, 0, z, 0, 0); drawBackground();
  drawWorld(); drawHUD();
  if (state === 'upgrade') drawUpgrade();
  if (state === 'over') drawOver();
}

// ───────────────────────── main loop ─────────────────────────
function clickUI() {
  if (!pressed.has('Mouse0')) return false;
  for (const r of uiRects) if (mouse.x > r.x && mouse.x < r.x + r.w && mouse.y > r.y && mouse.y < r.y + r.h) { r.fn(); return true; }
  return false;
}
function update(rdt) {
  uiT += rdt; if (flash > 0) flash -= rdt; shake = Math.max(0, shake - rdt * 45);
  if (hit('KeyM')) muted = !muted;
  if (state === 'title') {
    if (hit('ArrowLeft', 'KeyA')) { bladeIdx = (bladeIdx + BLADES.length - 1) % BLADES.length; store.set('ss_blade', String(bladeIdx)); sfx('ui'); }
    if (hit('KeyT')) toggleTurtle();
    if (hit('KeyP')) { sfx('ui'); pressed.clear(); startPractice(); }
    if (hit('ArrowRight', 'KeyD')) { bladeIdx = (bladeIdx + 1) % BLADES.length; store.set('ss_blade', String(bladeIdx)); sfx('ui'); }
    if (!clickUI() && hit('Enter', 'Space', 'Mouse0')) { sfx('ui'); pressed.clear(); startGame(); }
  } else if (state === 'play') {
    if (practice && hit('Escape')) { state = 'title'; practice = false; paused = false; }
    else if (hit('KeyP', 'Escape')) paused = !paused;
    if (practice && !paused && hit('KeyT')) { drill = (drill + 1) % DRILLS.length; sfx('ui'); }
    if (!paused) {
      if (hitstop > 0) hitstop -= rdt;
      else { let ts = 1; if (slowT > 0) { slowT -= rdt; ts = 0.3; } step(rdt * ts); }
    }
  } else if (state === 'upgrade') {
    if (uiT > 0.35) { if (hit('Digit1')) pickUpgrade(0); else if (hit('Digit2')) pickUpgrade(1); else if (hit('Digit3')) pickUpgrade(2); else clickUI(); }
  } else if (state === 'over') {
    step(rdt * 0.3);
    if (state === 'over' && uiT > 0.6 && hit('Enter', 'Space', 'Mouse0')) { pressed.clear(); startGame(); }
    else if (hit('Escape')) { state = 'title'; }
  }
  pressed.clear();
}
let last = performance.now();
function frame(ts) {
  const rdt = Math.min((ts - last) / 1000, 1 / 30); last = ts;
  update(rdt); render();
  requestAnimationFrame(frame);
}
player = newPlayer(); enemies = []; bolts = []; parts = []; debris = []; texts = []; orbs = []; ghosts = []; queue = [];
if (typeof location !== 'undefined' && /[?&]practice\b/.test(location.search || '')) startPractice();
requestAnimationFrame(frame);
</script>
